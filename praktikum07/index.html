<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Praktikum Function</h2>
    <button onclick="salam()">tampilkan salam</button>

    <script>
        function salam(nama) {
            alert(`Halo ${nama}, selamat belajar JavaScript!`);
        }
    </script>
</body>
