<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Daftar Mahasiswa</h2>
    <input type="text" id="name" placeholder="Masukkan Nama Anda">
    <button id="tambah">Tambah</button>
    <ul id="daftar"></ul>

    <script>
        const inputName = document.getElementById("name");
        const daftar = document.getElementById("daftar");
        
        function tambahMahasiswa() {
            const nama = inputName.value.trim();
            if (nama === "") {
                alert("Nama Wajib diisi") 
                return;
            }
            const item = document.createElement("li");
            item.appendChild(document.createTextNode(nama + " "));
            const tombolHapus = document.createElement("button")
            tombolHapus.textContent= "delete";
            tombolHapus.addEventListener("click", () => item.remove());
            item.appendChild(tombolHapus);
            daftar.appendChild(item);

            inputName.value = "";
            inputName.focus();            
        }
        document.getElementById("tambah").addEventListener("click", tambahMahasiswa);
    </script>
</body>
</html>
