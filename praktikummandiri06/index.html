<body>
    <h2>Praktikum Basic JavaScript</h2>
    <p>Lihat hasil melalui Console (F12)</p>


    <script>
        const nama = "Alya";
        let umur = 19;
        // let nilai= 90;
        let aktif = true;

        console.log("Nama : " + nama);
        console.log("Umur : " + umur);
        // console.log("Nilai : " + nilai);
        console.log("StatusAktif : " + aktif);
        // console.log("Type nilai: " + typeof(nilai));

        const tugas = 80;
        const uts = 90;
        const uas = 95;
        const akhir = (tugas * 0.30) + (uts * 0.30) + (uas * 0.30) * 0.40;

        console.log("Nilai Akhir: " + akhir);
        console.log("Lulus: " + (akhir >= 60));

        const nilai = 98;
        let kategori;
        if (nilai >= 85) {
            kategori = "A";
        } else if (nilai >= 70) {
            kategori = "B";
        } else if (nilai >= 60) {
            kategori = "C";
        } else if (nilai >= 50) {
            kategori = "D";
        } else {
            kategori = "E";
        }
        console.log("Nilai: " + nilai);
        console.log("Kategori: " + kategori);

        function hitungDiskon(harga,persen) {
            return harga - (harga * persen / 100);
        }

        for (let i = 1; i<= 3; i++) {
            const harga = i * 10000
            const bayar = hitungDiskon(harga,10);
            console.log("Harga : " + harga + " Bayar :" + bayar);
        }
       
    </script>
